# Tested Xiaomi Redmi K80 (zorn) display policy for this exact patch series.
# IMPORTANT: the display helper is built in with config/zorn.config.
# Its modprobe option below only helps modular builds. For this config, also
# pass drm_display_helper.dsc_pps_bpp_double=1 on the kernel command line.
options panel_xiaomi_o11_42_02_0a dsc_native_422=1 dsc_bpc=10
options msm dsc_initial_lines=3 dsc_full_ich_prec=1 dsc_xmit_delay=256 dsc_dec_delay=478 enable_spr=1
options drm_display_helper dsc_pps_bpp_double=1
options msm dsc_use_cdm=0
options msm spr_flush=1
options msm spr_abl_minimal=1
